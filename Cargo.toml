[package]
name = "codex-skills"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Curated public skill publication with informative commit messages"
license = "MIT"
repository = "https://github.com/syz51/skills"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
regex = "1"
tempfile = "3.27.0"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
unicode-normalization = "0.1"
caseless = "0.2.2"
signal-hook = "0.4.6"
nix = { version = "0.31.3", features = ["fs", "process", "signal"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
