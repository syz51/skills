name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14', '3.15']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the required test runner
        run: python -m pip install uv==0.13.6
      # The tests run offline, and the skill validator gets PyYAML through `uv run --with
      # pyyaml`; fetch it into the uv cache first so the offline run can resolve it.
      - name: Fetch the skill validator's PyYAML
        env:
          UV_OFFLINE: '0'
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run --no-project --with pyyaml python -c 'import yaml'
      - name: Run offline tests and repository release gates
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run --no-project python -m unittest discover -s tests

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust warnings
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run offline-model Rust tests
        run: cargo test --locked
      - name: Verify locked dependency notices
        run: python3 scripts/bundle_rust_licenses.py --output "$RUNNER_TEMP/THIRD_PARTY_LICENSES.txt"
      - name: Verify standalone binary
        run: |
          cargo build --release --locked
          target/release/codex-skills --help
          test "$(target/release/codex-skills --version)" = "codex-skills 0.1.0"
