name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Every export pushes to main, and each run scans the whole history, so an export whose own
  # run is cancelled by a later push is still scanned by that later run. Exemptions come only
  # from .gitleaks.toml: gitleaks:allow comments are ignored and a .gitleaksignore fails the
  # job. Repository attributes such as -diff, and NUL bytes, would reduce a file's history to
  # "Binary files differ"; the highest-precedence attributes file makes git show its text.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history with pinned gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" \
            --output "$scratch/$archive"
          (cd "$scratch" && printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check)
          tar -xzf "$scratch/$archive" -C "$scratch" gitleaks
          if [ -e .gitleaksignore ] || [ -L .gitleaksignore ]; then
            echo '::error::Remove .gitleaksignore; scan exemptions belong in .gitleaks.toml'
            exit 1
          fi
          mkdir -p .git/info
          printf '* diff\n' > .git/info/attributes
          "$scratch/gitleaks" git --config .gitleaks.toml --redact=100 \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$scratch"
          GITLEAKS="$scratch/gitleaks" python3 -B -m unittest discover -s tests -p test_secret_scan.py

  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14', '3.15']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the required test runner
        run: python -m pip install uv==0.13.6
      # The tests run offline, and the skill validator gets PyYAML through `uv run --with
      # pyyaml`; fetch it into the uv cache first so the offline run can resolve it.
      - name: Fetch the skill validator's PyYAML
        env:
          UV_OFFLINE: '0'
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run --no-project --with pyyaml python -c 'import yaml'
      - name: Run offline tests and repository release gates
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run --no-project python -m unittest discover -s tests

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust warnings
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run offline-model Rust tests
        run: cargo test --locked
      - name: Verify locked dependency notices
        run: python3 scripts/bundle_rust_licenses.py --output "$RUNNER_TEMP/THIRD_PARTY_LICENSES.txt"
      - name: Verify standalone binary
        run: |
          cargo build --release --locked
          target/release/codex-skills --help
          test "$(target/release/codex-skills --version)" = "codex-skills 0.1.0"
