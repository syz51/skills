name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline tests and repository release gates
        run: python -m unittest discover -s tests

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust warnings
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run offline-model Rust tests
        run: cargo test --locked
      - name: Verify locked dependency notices
        run: python3 scripts/bundle_rust_licenses.py --output "$RUNNER_TEMP/THIRD_PARTY_LICENSES.txt"
      - name: Verify standalone binary
        run: |
          cargo build --release --locked
          target/release/codex-skills --help
          test "$(target/release/codex-skills --version)" = "codex-skills 0.1.0"
